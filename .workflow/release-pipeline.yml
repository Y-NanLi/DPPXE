version: '1.0'
name: release-pipeline
displayName: Release Pipeline

# 1. 修正触发条件：使用 Gitee Go 规范的 matchType 和 branch
triggers:
  push:
    - matchType: PRECISE
      branch: main
    # 如需按 Tag 触发，请查阅 Gitee Go 文档中关于 Tag 触发的最新配置方式

stages:
  - stage:
      name: build-and-release
      displayName: 构建并发布
      steps:
        # 2. 使用 Gitee Go 规范的 Golang 构建插件 golangbuild@1
        - step: golangbuild@1
          name: build_go
          displayName: 编译 Go 程序
          inputs:
            golangVersion: '1.27' # 请确认 Gitee 支持该版本，否则可能需降级
          goals: |
            mkdir -p bin
            go build -tags desktop,production -trimpath -ldflags "-s -w -H windowsgui" -o bin/DP-PXE.exe .
            go build -trimpath -ldflags "-s -w" -o bin/DP-PXEClient.exe .
          artifacts:
            - name: GO_BUILD_OUTPUT
              path:
                - bin

        # 3. Release 插件（参数需进一步核实）
        - step: publish@gitee-release
          name: publish_release
          displayName: 发布 Release
          dependsOn: build_go
          tagName: ${GITEE_TAG}
          releaseName: "DP-PXE ${GITEE_TAG}"
          description: "自动构建于 Gitee Go，提交: ${GITEE_COMMIT}"
          assertFiles:
            - bin/DP-PXE.exe
            - bin/DP-PXEClient.exe
          prerelease: false
          allowUpdate: true
