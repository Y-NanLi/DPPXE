version: '1.0'
name: release-pipeline
displayName: Release Pipeline

# 触发条件：当推送以 v 开头的标签时触发（如 v1.0）
triggers:
  push:
    tags:
      include:
        - 'v*'

stages:
  - stage:
      name: build-and-release
      displayName: 构建并发布
      steps:
        # 1. 检出代码
        - step: checkout@git
          name: checkout
          displayName: 检出代码

        # 2. 编译 Go 程序
        - step: build@golang
          name: build_go
          displayName: 编译 Go 程序
          golangVersion: '1.27' # 匹配你 go.mod 中的版本
          commands:
            - mkdir -p bin
            # 编译图形界面版 (注意：Windows GUI 需要 CGO 和 MinGW，Gitee 默认 Linux 环境可能需要额外配置，这里先给基础编译)
            - go build -tags desktop,production -trimpath -ldflags "-s -w -H windowsgui" -o bin/DP-PXE.exe .
            # 编译控制台版
            - go build -trimpath -ldflags "-s -w" -o bin/DP-PXEClient.exe .
          artifacts:
            - name: GO_BUILD_OUTPUT
              path:
                - bin

        # 3. 发布 Release
        - step: publish@gitee-release
          name: publish_release
          displayName: 发布 Release
          dependsOn: build_go
          tagName: ${GITEE_TAG}
          releaseName: "DP-PXE ${GITEE_TAG}"
          description: "自动构建于 Gitee Go，提交: ${GITEE_COMMIT}"
          assertFiles:
            - bin/DP-PXE.exe
            - bin/DP-PXEClient.exe
          prerelease: false
          allowUpdate: true
