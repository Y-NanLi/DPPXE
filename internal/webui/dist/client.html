<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DP-PXEClient</title>
<link rel="stylesheet" href="client.css">
</head>
<body>
<div class="win">

  <!-- 标题栏（无边框窗口，整条可拖动） -->
  <div class="tbar">
    <div class="logo">DP</div>
    <div class="ttl" id="title">DP-PXEClient 1.1</div>
    <div class="spacer"></div>
    <button class="tbtn" id="btnMin" title="最小化">—</button>
    <button class="tbtn close" id="btnClose" title="关闭">✕</button>
  </div>

  <div class="body">
    <!-- 机器号 + 圆形进度 -->
    <div class="head">
      <div class="no" id="lblNo">机器号:未知</div>
      <div class="ring">
        <svg width="84" height="84" viewBox="0 0 84 84">
          <circle class="track" cx="42" cy="42" r="36"></circle>
          <circle class="bar" id="ringBar" cx="42" cy="42" r="36"></circle>
        </svg>
        <div class="pct" id="lblPct">0%</div>
      </div>
    </div>

    <!-- 客户端 / 服务端信息 -->
    <div class="info">
      <div class="line">
        <span class="k">客户端IP:</span> <span id="lblCliIP">0.0.0.0</span>
        <span class="gap"></span>
        <span class="k">版本:</span> <span id="lblCliVer">1.1</span>
      </div>
      <div class="line">
        <span class="k">服务端IP:</span> <span id="lblSrvIP">0.0.0.0</span>
        <span class="gap"></span>
        <span class="k">版本:</span> <span id="lblSrvVer">未知</span>
      </div>
    </div>

    <!-- 日志 -->
    <div class="log" id="log"></div>

    <div class="foot">Go Rebuild · Wails</div>
  </div>
</div>
<script src="client.js"></script>
</body>
</html>
