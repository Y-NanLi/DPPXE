name: Gitee Probe（临时诊断）

# 临时探针：验证 GitHub runner 能否访问 gitee.com API。
# 结论出来后就删掉这个文件。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测 gitee.com 可达性
        shell: bash
        run: |
          set +e
          URL="https://gitee.com/api/v5/version"
          echo "=== 0. DNS ==="
          getent hosts gitee.com || echo "DNS 解析失败"
          echo
          echo "=== 1. 默认 curl（HTTP/2）==="
          curl -sS -o /dev/null -w 'http=%{http_code} time=%{time_total}s\n' --connect-timeout 10 --max-time 30 "$URL"
          echo "exit=$?"
          echo
          echo "=== 2. 强制 HTTP/1.1 ==="
          curl -sS --http1.1 -o /dev/null -w 'http=%{http_code} time=%{time_total}s\n' --connect-timeout 10 --max-time 30 "$URL"
          echo "exit=$?"
          echo
          echo "=== 3. 强制 IPv4 + 带 UA + 重试 ==="
          curl -sS -4 -A 'Mozilla/5.0 (compatible; DP-PXE-CI)' --retry 3 --retry-all-errors --retry-delay 3 \
               -o /dev/null -w 'http=%{http_code} time=%{time_total}s\n' --connect-timeout 10 --max-time 40 "$URL"
          echo "exit=$?"
          echo
          echo "=== 4. 直接访问 gitee.com 首页 ==="
          curl -sS --http1.1 -o /dev/null -w 'http=%{http_code} time=%{time_total}s\n' --connect-timeout 10 --max-time 30 https://gitee.com/
          echo "exit=$?"
          echo
          echo "=== 5. 其他国内站点对比（证明不是全部外网都断）==="
          curl -sS -o /dev/null -w 'gitee.com http=%{http_code}\n' --connect-timeout 10 --max-time 20 https://gitee.com/ 2>&1
          curl -sS -o /dev/null -w 'baidu.com http=%{http_code}\n' --connect-timeout 10 --max-time 20 https://www.baidu.com/ 2>&1
          echo "done"
