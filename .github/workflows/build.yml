name: Build DP-PXE

# 触发条件：
#   - 推送到 main 分支 → 跑 CI 构建，并发布滚动「最新版」Release（prerelease）
#   - 发起对 main 的 PR → 只跑 CI 构建（不发布）
#   - 推送 v* 标签（如 v1.0） → 构建并发布正式版 GitHub Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# contents: write 仅发布 Release / 删除滚动标签时需要；普通 PR 时 GitHub 会自动忽略该权限
permissions:
  contents: write

jobs:
  build:
    name: Build (windows/amd64)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go 工具链
        uses: actions/setup-go@v5
        with:
          # 与 go.mod 的 go 1.27.x 对齐；若 setup-go 未提供对应 patch，
          # GOTOOLCHAIN=auto 会自动下载所需工具链
          go-version: '1.27'
          cache-dependency-path: go.sum

      - name: 安装 MinGW-w64（desktop GUI 编译依赖 CGO/gcc）
        shell: bash
        run: |
          C:/msys64/usr/bin/bash -lc "pacman -S --needed --noconfirm mingw-w64-x86_64-gcc"
          echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: 工具链自检
        shell: bash
        run: go version && gcc --version

      - name: 拉取 / 整理依赖
        shell: bash
        run: go mod tidy

      - name: 静态检查
        shell: bash
        run: go vet ./...

      - name: 编译图形界面版 DP-PXE.exe
        shell: bash
        run: |
          go build -tags desktop,production -trimpath -ldflags "-s -w -H windowsgui" -o bin/DP-PXE.exe .

      - name: 编译被控端 DP-PXEClient.exe（含 clientgui：PE 原生界面 + 已装系统 Wails 界面）
        shell: bash
        run: |
          # 两个 tags 都不能少：
          #   desktop,production → Wails runtime 不是空壳（漏了会弹 build tags 模态框）
          #   clientgui          → 编入 PE 原生界面（walk），漏了 PE 里只剩控制台
          # -H windowsgui → 双击不弹黑框（--nogui 时程序自己 AttachConsole）
          go build -tags "desktop,production,clientgui" -trimpath -ldflags "-s -w -H windowsgui" -o bin/DP-PXEClient.exe .

      - name: 自检（协议 / 控制通道 / 文件分片 / DHCP / HTTP / TFTP / 脚本引擎）
        shell: bash
        run: timeout 180 ./bin/DP-PXEClient.exe --selftest

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DP-PXE-windows-amd64
          path: bin/*.exe

  release:
    name: Release
    needs: build
    # 仅打 v* 标签、或 push 到 main 时发布；PR 不发布
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: DP-PXE-windows-amd64
          path: dist

      - name: 打包 netboot 与 AutoCommand（显式过滤 *.wim，排除 585MB 的 PE 镜像）
        shell: bash
        run: |
          git archive --format=zip -o netboot.zip HEAD netboot ':(exclude)**/*.wim'
          git archive --format=zip -o AutoCommand.zip HEAD AutoCommand

      - name: 发布正式版（tag v*，自动生成 Release Notes）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "DP-PXE $tag" \
            --generate-notes \
            dist/*.exe netboot.zip AutoCommand.zip

      - name: 发布滚动最新版（push 到 main → prerelease）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 先删除旧的 latest 发布与标签，再重建为最新滚动版
          gh release delete latest --yes || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" || true
          gh release create latest \
            --prerelease \
            --title "Latest Build (${GITHUB_SHA:0:7})" \
            --notes "自动构建于 push 到 main。
          Commit: ${GITHUB_SHA}
          构建时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            dist/*.exe netboot.zip AutoCommand.zip

  # ───────────────────────────────────────────────────────────────────────────
  # 把同一个 Release 同步到 Gitee。
  #
  # 为什么不用 Gitee Go 流水线：Gitee 侧是「GitHub → Gitee」的只读镜像，
  # 镜像同步不会产生 push 事件，Gitee Go 的 tag 触发不会自己跑；而且 Gitee Go
  # 没有对外触发 API。所以改成「GitHub 构建完，直接调 Gitee OpenAPI 建发行版」。
  #
  # 需要的配置（GitHub 仓库 → Settings → Secrets and variables → Actions）：
  #   Secret  GITEE_TOKEN   必填，Gitee 私人令牌（权限勾 projects）
  #   Variable GITEE_OWNER  选填，默认 nan-liGit（Gitee 命名空间与 GitHub 的 Y-NanLi 不同！）
  #   Variable GITEE_REPO   选填，默认 DPPXE
  # 没配 GITEE_TOKEN 时本作业只打警告并跳过，不影响 GitHub 侧的发布。
  # ───────────────────────────────────────────────────────────────────────────
  gitee-release:
    name: Gitee Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      # 注意：Gitee 侧仓库是 nan-liGit/DPPXE，GitHub 侧是 Y-NanLi/DPPXE，命名空间不一样
      GITEE_OWNER: ${{ vars.GITEE_OWNER || 'nan-liGit' }}
      GITEE_REPO: ${{ vars.GITEE_REPO || 'DPPXE' }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: DP-PXE-windows-amd64
          path: dist

      - name: 打包 netboot 与 AutoCommand
        shell: bash
        run: |
          git archive --format=zip -o netboot.zip HEAD netboot ':(exclude)**/*.wim'
          git archive --format=zip -o AutoCommand.zip HEAD AutoCommand
          ls -lh dist/*.exe netboot.zip AutoCommand.zip

      - name: 推送到 Gitee 发行版
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::未配置 GITEE_TOKEN，跳过 Gitee 发版（GitHub 侧已正常发布）"
            exit 0
          fi

          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          ASSETS="DP-PXE.exe DP-PXEClient.exe netboot.zip AutoCommand.zip"

          # gitee.com 从 GitHub runner（Azure）跨境访问：建连经常 10~30 秒，偶发 reset / timeout。
          # 实测 gitee.com 本身可达（首页 200），所以靠「长超时 + 多重试」扛过去。
          CURL="curl -sS --http1.1 -4 --connect-timeout 30 --max-time 180 --retry 8 --retry-delay 8 --retry-connrefused --retry-max-time 600"

          echo "== 预检：确认仓库与令牌可用 =="
          rc=$($CURL -o /dev/null -w '%{http_code}' -G "${API}" \
                --data-urlencode "access_token=${GITEE_TOKEN}" || echo "000")
          if [ "$rc" = "000" ]; then
            echo "::error::连不上 gitee.com（重试后仍失败）。gitee.com 本身可达，属跨境抖动，重跑本作业即可"
            exit 1
          fi
          if [ "$rc" != "200" ]; then
            echo "::error::访问 ${GITEE_OWNER}/${GITEE_REPO} 返回 HTTP ${rc}。请检查 GITEE_OWNER/GITEE_REPO（Gitee 是 nan-liGit，不是 GitHub 的 Y-NanLi）与令牌 projects 权限"
            exit 1
          fi
          echo "   OK ${GITEE_OWNER}/${GITEE_REPO}"

          NOTES="$(printf 'DP-PXE %s 自动构建发布\n\n- 提交：%s\n- GitHub Release：https://github.com/%s/releases/tag/%s\n- 详细变更见仓库 更新记录.md\n- PE 镜像 win11x64.WIM 体积超限，不在产物内，需自备' \
            "$TAG" "${GITHUB_SHA}" "${GITHUB_REPOSITORY}" "$TAG")"

          echo "== 查找 tag ${TAG} 是否已有 Release =="
          resp=$($CURL -w '\n%{http_code}' -G "${API}/releases/tags/${TAG}" \
                  --data-urlencode "access_token=${GITEE_TOKEN}" || true)
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "   HTTP ${code:-<空>}"

          # Gitee 的坑：tag 不存在时 /releases/tags/{tag} 返回 **200 + 响应体 null**（不是 404）。
          # 所以按「能不能取到数字 id」来判断，取不到就走创建。
          case "$code" in
            200|404) ;;
            *)
              echo "::error::查询 Release 失败（HTTP ${code:-空}，多为跨境超时），重跑本作业即可"
              exit 1 ;;
          esac

          RID=""
          if [ "$code" = "200" ]; then
            RID=$(printf '%s' "$body" | jq -r 'if type=="object" then (.id // empty) else empty end' 2>/dev/null || true)
            case "$RID" in
              ''|*[!0-9]*) RID="" ;;
            esac
          fi

          if [ -z "$RID" ]; then
            echo "该 tag 尚无 Release（响应 $(printf '%s' "$body" | head -c 40)），创建新的"
            # Gitee 创建 Release 必须带 target_commitish（否则报 target_commitish is missing）。
            # 另外 Gitee 侧是 GitHub 的镜像，tag/提交可能还没同步过来，会报「创建标签失败：vX.Y」，
            # 所以这里等一会儿重试，最多 10 次 × 60 秒。
            attempt=0
            while [ "$attempt" -lt 10 ]; do
              attempt=$((attempt + 1))
              created=$($CURL -X POST "${API}/releases" \
                -H 'Content-Type: application/json;charset=UTF-8' \
                -d "$(jq -n --arg t "$GITEE_TOKEN" --arg tag "$TAG" --arg name "DP-PXE ${TAG}" \
                      --arg body "$NOTES" --arg tc "${GITHUB_SHA}" \
                      '{access_token:$t,tag_name:$tag,name:$name,body:$body,target_commitish:$tc,prerelease:false}')" || true)
              RID=$(printf '%s' "$created" | jq -r 'if type=="object" then (.id // empty) else empty end' 2>/dev/null || true)
              case "$RID" in ''|*[!0-9]*) RID="" ;; esac
              [ -n "$RID" ] && break

              snippet=$(printf '%s' "$created" | head -c 200)
              echo "  第 ${attempt}/10 次创建失败：${snippet}"
              if printf '%s' "$snippet" | grep -q "创建标签失败"; then
                echo "  → Gitee 镜像尚未同步到 ${TAG}，等 60 秒后重试（共最多 10 分钟）"
                sleep 60
                continue
              fi
              break   # 其它错误（权限/参数）不重试
            done

            if [ -z "$RID" ]; then
              echo "::error::创建 Gitee Release 失败。若原因是「创建标签失败：${TAG}」，说明 Gitee 镜像还没同步该标签——去 Gitee 仓库点一次「同步」后，重新运行本作业即可"
              exit 1
            fi
            echo "新建 Release id=${RID}"
          else
            echo "已存在 Release id=${RID}，更新标题与说明"
            $CURL -X PATCH "${API}/releases/${RID}" \
              -H 'Content-Type: application/json;charset=UTF-8' \
              -d "$(jq -n --arg t "$GITEE_TOKEN" --arg tag "$TAG" --arg name "DP-PXE ${TAG}" --arg body "$NOTES" \
                    '{access_token:$t,tag_name:$tag,name:$name,body:$body,prerelease:false}')" > /dev/null || true

            echo "== 删除同名旧附件（避免重名上传失败）=="
            listing=$($CURL -G "${API}/releases/${RID}/attach_files" \
                       --data-urlencode "access_token=${GITEE_TOKEN}" || true)
            if printf '%s' "$listing" | jq -e 'type=="array"' > /dev/null 2>&1; then
              printf '%s' "$listing" | jq -r '.[] | "\(.id) \(.name)"' | while read -r aid aname; do
                for want in $ASSETS; do
                  if [ "$aname" = "$want" ]; then
                    echo "  删除 $aname (id=$aid)"
                    $CURL -X DELETE "${API}/releases/${RID}/attach_files/${aid}" \
                         --data-urlencode "access_token=${GITEE_TOKEN}" > /dev/null || true
                  fi
                done
              done
            else
              echo "   （列附件失败或为空，跳过删除，直接尝试上传）"
            fi
          fi

          echo "== 上传附件 =="
          for f in dist/DP-PXE.exe dist/DP-PXEClient.exe netboot.zip AutoCommand.zip; do
            name=$(basename "$f")
            echo "  上传 ${name}"
            out=$($CURL -X POST "${API}/releases/${RID}/attach_files" \
                    -F "access_token=${GITEE_TOKEN}" \
                    -F "file=@${f}" || true)
            if printf '%s' "$out" | jq -e '.name' > /dev/null 2>&1; then
              echo "    OK $(printf '%s' "$out" | jq -r '.name')"
            else
              echo "::error::上传 ${name} 失败，响应片段：$(printf '%s' "$out" | head -c 300)"
              exit 1
            fi
          done

          echo "完成：https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/tag/${TAG}"
